services:
   assign_servicebox_pr_rights_from_cloud_calendar:
      build: .
      restart: unless-stopped
      env_file:
        - path: ./global_config.env
          required: false
        - path: ./assign_servicebox_pr_rights_from_cloud_calendar.env
          required: true
        
      environment:
         DELAY: ${DELAY-20s}
      volumes:
         - ./pwdfile.txt:/etc/pwdfile.txt:ro
         - ./etc/:/code/etc/:ro
      command:
         - bash
         - -c
         - 'while true; do echo "INFO: $$( date )" 1>&2; /code/bin/updateGroupsFromAppointements.sh; echo "INFO: $$( date ) ========== Next check in $${DELAY} ==========" 1>&2; sleep $${DELAY}; done'
      networks:
         - internal_services
      logging: &logging_shared_config
         driver: json-file
         options:
            max-size: 100m
            max-file: "3"

   assign_servicebox_doc_rights_from_cloud_calendar:
      build: .
      restart: unless-stopped
      env_file:
        - path: ./global_config.env
          required: false
        - path: ./assign_servicebox_doc_rights_from_cloud_calendar.env
          required: true
        
      environment:
         DELAY: ${DELAY-20s}
      volumes:
         - ./pwdfile.txt:/etc/pwdfile.txt:ro
         - ./etc/:/code/etc/:ro
      command:
         - bash
         - -c
         - 'while true; do echo "INFO: $$( date )" 1>&2; /code/bin/updateGroupsFromAppointements.sh; echo "INFO: $$( date ) ========== Next check in $${DELAY} ==========" 1>&2; sleep $${DELAY}; done'
      networks:
         - internal_services
      logging: &logging_shared_config
         driver: json-file
         options:
            max-size: 100m
            max-file: "3"

   sync_forum_affiliated_with_ldap_cloud_groups:
      build: .
      restart: unless-stopped
      env_file:
        - path: ./global_config.env
          required: false
        - path: ./sync_forum_affiliated_with_ldap_cloud_groups.env
          required: true
        
      environment:
         DELAY: 1h
      volumes:
         - ./pwdfile.txt:/etc/pwdfile.txt:ro
         - ./_vols_/cache/:/var/cache4sync/:rw
      command:
         - bash
         - -c
         - 'while true; do echo "INFO: $$( date )" 1>&2; /code/bin/syncForumAffiliatedWithLdapGroups.sh; echo "INFO: $$( date ) ========== Next check in $${DELAY} ==========" 1>&2; sleep $${DELAY}; done'
      networks:
         - internal_services
      logging: *logging_shared_config

   sync_forum_groups_with_ldap_cloud_groups:
      build: .
      restart: unless-stopped
      user: 1001:1001
      env_file:
        - path: ./global_config.env
          required: false
        - path: ./sync_forum_groups_with_ldap_cloud_groups.env
          required: true
        
      volumes:
         - ./pwdfile.txt:/etc/pwdfile.txt:ro
         - ./_vols_/sync_forum_groups_with_ldap_cloud_groups/cache/:/var/cache4sync/:rw
      command:
         - bash
         - -c
         - 'while true;
            do
               echo "INFO: $$( date )" 1>&2;
               echo "Sync $${INVISION_GROUP_ID1} => $${LDAP_GROUP_LDAP_CN1}";
               /code/bin/syncForumGroupWithLdapGroup.sh "$${INVISION_GROUP_ID1}" "$${LDAP_GROUP_LDAP_CN1}";
               echo "Sync $${INVISION_GROUP_ID2} => $${LDAP_GROUP_LDAP_CN2}";
               /code/bin/syncForumGroupWithLdapGroup.sh "$${INVISION_GROUP_ID2}" "$${LDAP_GROUP_LDAP_CN2}";
               echo "Sync $${INVISION_GROUP_ID3} => $${LDAP_GROUP_LDAP_CN3}";
               /code/bin/syncForumGroupWithLdapGroup.sh "$${INVISION_GROUP_ID3}" "$${LDAP_GROUP_LDAP_CN3}";
               echo "INFO: $$( date ) ========== Next check in $${DELAY} ==========" 1>&2;
               sleep $${DELAY};
            done'
      networks:
         - internal_services
      logging: *logging_shared_config
      
networks:

   internal_services:
      external: true
      name: internal_services
